<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Sistema Solar</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link rel="stylesheet" href="styles/biblioteca.css">
    <!-- Tema "Explorador Divertido": importado em src/biblioteca.js (primeiro import)
         para garantir ordem na cascata também no build. -->
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <!-- Language Switcher -->
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="pt">🇵🇹 Português</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        </div>

        <a href="/" class="back-link" data-i18n="back_to_solar">← Voltar ao Sistema Solar</a>

        <header>
            <h1 data-i18n="library_title">📚 Biblioteca do Sistema Solar</h1>
            <p class="subtitle" data-i18n="library_subtitle">Explora tudo sobre o nosso vizinhança cósmica!</p>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Procurar planetas, luas, sondas...">
            <span class="search-icon">🔍</span>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs">
            <button class="cat-tab active" data-category="all" data-i18n="cat_all">🌌 Todos</button>
            <button class="cat-tab" data-category="star" data-i18n="cat_star">☀️ Estrela</button>
            <button class="cat-tab" data-category="planets" data-i18n="cat_planets">🪐 Planetas</button>
            <button class="cat-tab" data-category="moons" data-i18n="cat_moons">🌙 Luas</button>
            <button class="cat-tab" data-category="dwarfs" data-i18n="cat_dwarfs">🔴 Anões</button>
            <button class="cat-tab" data-category="probes" data-i18n="cat_probes">🛰️ Sondas</button>
        </div>

        <!-- Content Grid -->
        <div id="contentGrid" class="content-grid">
            <!-- Content will be dynamically generated -->
        </div>

        <!-- Detail Modal -->
        <div id="detailModal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" id="modal-close-btn">✕</button>
                <div id="modalBody">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
    </div>

    <script src="src/data/bibliotecaData.js" type="module"></script>
    <script src="src/biblioteca.js" type="module"></script>
    <!-- Ícones próprios (type=module para o Vite incluir no build) -->
    <script type="module" src="src/cosmic-icons.js"></script>
</body>
</html>
