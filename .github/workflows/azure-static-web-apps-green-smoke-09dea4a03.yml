name: Azure Static Web Apps PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # Deploy steps below require the Azure token secret, which is unavailable to
      # Dependabot-triggered runs (separate secret store). Skip them for Dependabot so
      # its PRs are gated on validation (tests/lint/typecheck) only, instead of failing.
      - name: Build preview
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          # PR previews are always telemetry-free. Production is owned by release.yml.
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ''
        run: npm run build:paper
      - name: Deploy preview
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_SMOKE_09DEA4A03 }}
        run: npx --yes @azure/static-web-apps-cli@2.0.9 deploy dist-paper-preview --env "${{ github.event.pull_request.number }}" --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    # Least-privilege: this job only tears down the PR staging env via the Azure token.
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        # The close action currently fails service-side with "No matching static
        # site found" even with a fresh token (Azure bug, open + unresolved:
        # https://github.com/Azure/static-web-apps/issues/1638). The red X is
        # unactionable, so don't fail the run. Consequence: PR staging envs are
        # NOT torn down automatically — when the Free-tier limit (3) is hit,
        # clean up with:
        #   az staticwebapp environment list --name solar-system-explorer
        #   az staticwebapp environment delete --name solar-system-explorer --environment-name <n> --yes
        # (Dependabot PRs skip deploy entirely, so envs only accumulate on human PRs.)
        continue-on-error: true
        with:
          # Required also for action:close — without it the teardown fails with
          # "deployment_token was not provided" and PR staging envs leak.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_SMOKE_09DEA4A03 }}
          action: "close"
          app_location: "/"
