name: Correct science or content
description: A measurement, image, translation, or source seems incorrect.
title: "[Science]: "
labels: [content, science, triage]
body:
  - type: input
    id: object
    attributes:
      label: Object or page
      placeholder: Deimos · Today card / Library
    validations: { required: true }
  - type: textarea
    id: current
    attributes:
      label: What is incorrect or unclear?
    validations: { required: true }
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Verifiable scientific source
      placeholder: NASA, ESA, or JPL page, or a scientific paper
    validations: { required: true }
