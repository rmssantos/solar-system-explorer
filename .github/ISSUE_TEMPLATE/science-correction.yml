name: Corrigir ciência ou conteúdo
description: Uma medida, imagem, tradução ou fonte parece incorreta.
title: "[Ciência]: "
labels: [content, science, triage]
body:
  - type: input
    id: object
    attributes:
      label: Objeto ou página
      placeholder: Deimos · ficha Hoje / Biblioteca
    validations: { required: true }
  - type: textarea
    id: current
    attributes:
      label: O que está incorreto ou confuso?
    validations: { required: true }
  - type: textarea
    id: correction
    attributes:
      label: Correção sugerida
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Fonte científica verificável
      placeholder: Página da NASA, ESA, JPL ou artigo científico
    validations: { required: true }
