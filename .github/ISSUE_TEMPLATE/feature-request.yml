name: Suggest an improvement
description: An idea to make the expedition more useful, clear, or fun.
title: "[Idea]: "
labels: [enhancement, triage]
body:
  - type: dropdown
    id: audience
    attributes:
      label: Who would benefit most?
      options: [Children, Families, Teachers and schools, Everyone]
    validations: { required: true }
  - type: textarea
    id: need
    attributes:
      label: What need does it address?
      description: Explain the problem or opportunity first.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine the experience?
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy
      options:
        - label: This suggestion does not require collecting children's personal data.
          required: true
