name: Sugerir uma melhoria
description: Uma ideia para tornar a expedição mais útil, clara ou divertida.
title: "[Ideia]: "
labels: [enhancement, triage]
body:
  - type: dropdown
    id: audience
    attributes:
      label: Quem beneficiaria mais?
      options: [Crianças, Famílias, Professores e escolas, Todos]
    validations: { required: true }
  - type: textarea
    id: need
    attributes:
      label: Que necessidade resolve?
      description: Explica primeiro o problema ou oportunidade.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Como imaginas a experiência?
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Privacidade
      options:
        - label: A sugestão não exige recolher dados pessoais de crianças.
          required: true
