name: Reportar um problema
description: Algo não funciona no jogo, biblioteca ou site.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudares. Não incluas nomes, emails ou outros dados pessoais.
  - type: dropdown
    id: area
    attributes:
      label: Onde aconteceu?
      options: [Jogo e voo, Cockpit, Caderno e quizzes, Biblioteca, Homepage, Privacidade e métricas, Outro]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Indica passos curtos, o que esperavas e o que aconteceu.
      placeholder: "1. Abri…\n2. Cliquei…\n3. Vi…"
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser e dispositivo
      placeholder: Chrome 128 · Windows 11 / Safari · iPad
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Imagem ou informação adicional
      description: Podes arrastar uma captura sem informação pessoal.
