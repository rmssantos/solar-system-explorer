name: Report a bug
description: Something is not working in the game, library, or website.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping. Do not include names, email addresses, or other personal information.
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options: [Game and flight, Cockpit, Notebook and quizzes, Library, Homepage, Privacy and analytics, Other]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide short steps, what you expected, and what happened.
      placeholder: "1. I opened…\n2. I clicked…\n3. I saw…"
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 128 · Windows 11 / Safari · iPad
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or additional information
      description: You can drag in a screenshot that does not contain personal information.
