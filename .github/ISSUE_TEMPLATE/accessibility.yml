name: Report an accessibility issue
description: A keyboard, screen reader, visual, hearing, or motion barrier.
title: "[Accessibility]: "
labels: [accessibility, triage]
body:
  - type: dropdown
    id: barrier
    attributes:
      label: Type of barrier
      options: [Keyboard, Screen reader, Contrast or readability, Motion or animation, Zoom or text size, Game controls, Other]
    validations: { required: true }
  - type: textarea
    id: impact
    attributes:
      label: What were you unable to do?
    validations: { required: true }
  - type: input
    id: setup
    attributes:
      label: Assistive technology and device
      placeholder: NVDA + Firefox / VoiceOver + Safari / keyboard only
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
