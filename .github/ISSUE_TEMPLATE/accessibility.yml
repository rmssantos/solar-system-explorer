name: Reportar acessibilidade
description: Uma barreira de teclado, leitura, visão, audição ou movimento.
title: "[Acessibilidade]: "
labels: [accessibility, triage]
body:
  - type: dropdown
    id: barrier
    attributes:
      label: Tipo de barreira
      options: [Teclado, Leitor de ecrã, Contraste ou legibilidade, Movimento ou animação, Zoom ou tamanho, Controlos do jogo, Outro]
    validations: { required: true }
  - type: textarea
    id: impact
    attributes:
      label: O que não conseguiste fazer?
    validations: { required: true }
  - type: input
    id: setup
    attributes:
      label: Tecnologia e dispositivo
      placeholder: NVDA + Firefox / VoiceOver + Safari / apenas teclado
  - type: textarea
    id: suggestion
    attributes:
      label: O que ajudaria?
